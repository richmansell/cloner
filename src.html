<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pacer — free running coach</title>
<meta name="description" content="Free, personalised running plans for 5K, 10K, half and full marathon. Built around your week and the sessions you enjoy.">
<meta name="theme-color" content="#0b0d12">
<meta property="og:title" content="Pacer — free running coach">
<meta property="og:description" content="Personalised running plans built around your week. Free, no sign-up.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#eef0f4; --text:#0f1218; --muted:#5b6474; --line:#e2e5eb;
  --brand:#5b5bf7; --brand-2:#8b5cf6; --brand-ink:#ffffff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --shadow:0 1px 2px rgba(15,18,24,.06),0 4px 16px rgba(15,18,24,.06);
  --r:16px; --r-sm:10px;
  --t-easy:#16a34a; --t-recovery:#0d9488; --t-long:#2563eb; --t-tempo:#ea580c; --t-intervals:#e11d48; --t-hills:#a16207;
  --t-fartlek:#9333ea; --t-progression:#ca8a04; --t-racepace:#db2777; --t-race:#d97706; --t-runwalk:#059669; --t-strength:#475569;
  --z0:#94a3b8; --z1:#5eead4; --z2:#4ade80; --z3:#facc15; --z4:#fb923c; --z5:#f43f5e;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d12; --surface:#151821; --surface-2:#1d212c; --text:#eef1f6; --muted:#9aa3b2; --line:#272c38;
    --brand:#7c7cff; --brand-2:#a78bfa; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --t-easy:#22c55e; --t-recovery:#2dd4bf; --t-long:#60a5fa; --t-tempo:#fb923c; --t-intervals:#fb7185; --t-hills:#d4a72c;
    --t-fartlek:#c084fc; --t-progression:#facc15; --t-racepace:#f472b6; --t-race:#fbbf24; --t-runwalk:#34d399; --t-strength:#94a3b8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d12; --surface:#151821; --surface-2:#1d212c; --text:#eef1f6; --muted:#9aa3b2; --line:#272c38;
  --brand:#7c7cff; --brand-2:#a78bfa; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --t-easy:#22c55e; --t-recovery:#2dd4bf; --t-long:#60a5fa; --t-tempo:#fb923c; --t-intervals:#fb7185; --t-hills:#d4a72c;
  --t-fartlek:#c084fc; --t-progression:#facc15; --t-racepace:#f472b6; --t-race:#fbbf24; --t-runwalk:#34d399; --t-strength:#94a3b8;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{line-height:1.15;margin:0}
h1{font-size:28px;letter-spacing:-.02em}
h2{font-size:20px;letter-spacing:-.01em}
h3{font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card.flat{box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;min-height:44px;transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--brand-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);letter-spacing:.02em}
.pill.brand{background:color-mix(in srgb,var(--brand) 15%,transparent);color:var(--brand)}
.badge{display:inline-grid;place-items:center;min-width:40px;height:40px;padding:0 6px;border-radius:12px;font-weight:800;font-size:11px;letter-spacing:.04em;color:#fff;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.logo-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center}
.avatar{width:36px;height:36px;border-radius:999px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;border:1px solid var(--line)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);min-height:52px;border-radius:12px}
nav.tabs button[aria-current="page"]{color:var(--brand)}
nav.tabs svg{width:24px;height:24px}

/* week strip */
.weekhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ring{width:76px;height:76px;flex:none}
.days{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.day{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.day .dl{text-align:center;padding-top:10px}
.day .dl .d{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day .dl .n{font-size:20px;font-weight:800}
.day.today .dl .n{color:var(--brand)}
.day.today .dl .d{color:var(--brand)}
.wk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.wk + .wk{margin-top:8px}
.wk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.wk .t{font-weight:700}
.wk .m{font-size:13px;color:var(--muted)}
.wk .st{margin-left:auto;flex:none}
.wk.done{opacity:.72}
.wk.done .t{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:color-mix(in srgb,var(--text) 40%,transparent)}
.wk.missed .st{color:var(--bad)}
.wk.today{outline:2px solid var(--brand);outline-offset:-1px}
.rest{padding:12px 14px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:14px}
.check{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--ok);color:#fff}
.skip{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}

/* coach card */
.coach{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 14%,var(--surface)),var(--surface));}
.coach .who{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-weight:700}

/* plan */
.chart{width:100%;height:150px;display:block}
.weekrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.weekrow + .weekrow{margin-top:8px}
.weekrow.cur{outline:2px solid var(--brand)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:999px;background:var(--tc)}
.dot.done{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--tc)}
.phase-Base{--pc:#60a5fa}.phase-Build{--pc:#a78bfa}.phase-Peak{--pc:#f472b6}.phase-Taper{--pc:#34d399}.phase-Race{--pc:#fbbf24}
.ppill{background:color-mix(in srgb,var(--pc) 20%,transparent);color:var(--text)}
.hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#8b5cf6 0%,#5b5bf7 40%,#1e1b4b 100%);border:0}
.hero .muted{color:rgba(255,255,255,.75)}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat{background:var(--surface-2);border-radius:12px;padding:12px}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.hero .stat{background:rgba(255,255,255,.12)}
.hero .stat .l{color:rgba(255,255,255,.75)}

/* tables */
table{width:100%;border-collapse:collapse}
td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.zsw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle}

/* forms */
label.f{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.input,select.input{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.input:focus{outline:2px solid var(--brand);border-color:transparent}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px 16px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);min-height:56px}
.choice .ct{font-weight:700}
.choice .cd{font-size:13px;color:var(--muted)}
.choice[aria-pressed="true"],.choice[aria-checked="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--surface))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 14px;font-weight:700;min-height:44px;min-width:52px}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:#fff}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px;min-height:36px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.pref{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pref:last-child{border-bottom:0}
.range{width:100%;accent-color:var(--brand);height:32px}
.rangeval{font-size:28px;font-weight:800;letter-spacing:-.02em}

/* onboarding */
.ob{min-height:100vh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.ob .progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:6px 0 24px}
.ob .progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:999px;transition:width .3s}
.ob .body{flex:1}
.ob .foot{display:flex;gap:10px;margin-top:24px;position:sticky;bottom:0;padding:12px 0 0;background:linear-gradient(transparent,var(--bg) 30%)}
.ob .foot .btn.primary{flex:1}
.ob h1{margin-bottom:8px}
.ob .lead{color:var(--muted);margin:0 0 20px}
.welcome{display:flex;flex-direction:column;justify-content:center;min-height:70vh;gap:16px}
.welcome .mark{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;box-shadow:0 12px 40px color-mix(in srgb,var(--brand) 45%,transparent)}
.feat{display:flex;gap:12px;align-items:flex-start}
.feat .fi{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);display:grid;place-items:center;flex:none}
.banner{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--brand) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);font-size:14px}
.warn{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:14px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,7,12,.5);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);z-index:41;border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .25s ease;padding:0 0 calc(20px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet .in{max-width:720px;margin:0 auto;padding:8px 16px 0}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 10px}
@media (min-width:760px){.sheet{left:50%;right:auto;width:680px;transform:translate(-50%,110%);bottom:24px;border-radius:24px;max-height:86vh}.sheet.on{transform:translate(-50%,0)}}
.whead{padding:18px;border-radius:var(--r);color:#fff;background:linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 55%,#000))}
.whead .muted{color:rgba(255,255,255,.8)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.metrics div{background:rgba(255,255,255,.15);border-radius:12px;padding:10px}
.metrics b{display:block;font-size:20px;letter-spacing:-.02em}
.metrics span{font-size:12px;opacity:.85}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps .bar{width:6px;align-self:stretch;border-radius:9px;flex:none}
.steps .rep{border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:8px 0;background:var(--surface)}
.steps .rep .rh{font-weight:800;font-size:13px;color:var(--brand);padding:6px 0 0}
.svgchart{width:100%;height:64px;display:block;margin-top:6px}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel .btn{border-radius:14px;flex-direction:column;gap:2px;padding:10px 6px;min-height:64px;font-size:14px}
.feel .btn small{font-weight:500;color:var(--muted);font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:all .25s;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:32px 16px}
details summary{cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";float:right;color:var(--muted)}
details[open] summary::after{content:"－"}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){h1{font-size:24px}.metrics b{font-size:17px}.hero .big{font-size:32px}}
@media print{nav.tabs,.topbar .row,.no-print{display:none!important}.wrap{padding:0}.card,.wk{box-shadow:none}}
</style>
</head>

<div id="root"></div>

<script>
(() => {
'use strict';
const E = Engine;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KEY = 'pacer.v1';
const TYPES = {
  easy: { label: 'Easy run', ab: 'EZ' }, recovery: { label: 'Recovery run', ab: 'REC' }, long: { label: 'Long run', ab: 'LR' },
  tempo: { label: 'Tempo', ab: 'TMP' }, intervals: { label: 'Intervals', ab: 'INT' }, hills: { label: 'Hills', ab: 'HILL' },
  fartlek: { label: 'Fartlek', ab: 'FK' }, progression: { label: 'Progression', ab: 'PRO' }, racepace: { label: 'Race pace', ab: 'RP' },
  race: { label: 'Race', ab: 'RACE' }, runwalk: { label: 'Run / walk', ab: 'R/W' }, strength: { label: 'Strength', ab: 'STR' },
};
const QUALITY = new Set(['tempo', 'intervals', 'hills', 'fartlek', 'progression', 'racepace']);
const tc = t => `var(--t-${t})`;
const ICON = {
  week: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  paces: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 13l4-3M9 2h6"/></svg>',
  me: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  left: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  right: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>',
  x: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  bolt: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  logo: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4a2 2 0 1 0 0-.01M7 21l3-6 3 2v5M10 15l1-5 4 3 3 1M8 10l3-1"/></svg>',
  share: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
  cal: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M12 13v5M9.5 15.5L12 18l2.5-2.5"/></svg>',
};

// ---------- storage ----------
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.profiles) return s; } catch (e) {}
  return { activeId: null, profiles: {}, theme: null };
}
let S = load();
let storageOk = true;

const me = () => S.profiles[S.activeId] || null;

// ---------- units & formatting ----------

// ---------- WEEK VIEW ----------
const PHASE_MSG = {
  Base: 'Base phase: building your aerobic engine. Most running is easy — that’s the point. Resist the urge to push the easy days.',
  Build: 'Build phase: sessions get more specific. Nail the quality days, keep easy days truly easy, and sleep well.',
  Peak: 'Peak phase: your biggest weeks. Fuel properly, prioritise recovery, and trust the process.',
  Taper: 'Taper: volume drops so you arrive fresh. Feeling restless or sluggish is normal — keep the legs ticking over.',

}

  const meta = w.type === 'strength' ? `${w.mins} min · bodyweight` : `${dist(t.m)} · ~${dur(t.sec)}`;
  const icon = st === 'done' ? `<span class="check" aria-label="Completed">${ICON.check}</span>` : st === 'skipped' ? `<span class="skip" aria-label="Skipped">${ICON.x}</span>` : st === 'missed' ? `<span class="small" style="color:var(--bad);font-weight:700">Missed</span>` : `<span class="muted" aria-hidden="true">${ICON.right}</span>`;
  return `<button class="wk ${st === 'done' || st === 'skipped' ? 'done' : ''} ${st}" style="--tc:${tc(w.type)}" data-open="${w.id}">
    <span class="badge" style="background:${tc(w.type)}">${TYPES[w.type].ab}</span>
    <span style="min-width:0"><span class="t" style="display:block">${esc(w.title)}</span><span class="m">${TYPES[w.type].label} · ${meta}</span></span>

}
function renderWeek(r) {

  const totalM = runs.reduce((s, w) => s + E.totals(w.steps, pt).m, 0);
  const doneM = runs.filter(w => r.log[w.id]?.done).reduce((s, w) => s + (r.log[w.id].km ? r.log[w.id].km * 1000 : E.totals(w.steps, pt).m), 0);

// ---------- WORKOUT SHEET ----------
let sheetId = null;
function findW(id, r = me()) { return allWorkouts(r).find(w => w.id === id); }
function zoneColor(p) { return `var(--z${E.PACE_INFO[p]?.zone ?? 2})`; }
function chartSvg(steps, pt) {

  let x = 0; const W = 600, H = 64;
  const bars = flat.map(s => { const w = E.stepSecs(s, pt) / tot * W; const z = E.PACE_INFO[s.p]?.zone ?? 2; const h = 14 + z * 10; const out = `<rect x="${x.toFixed(1)}" y="${H - h}" width="${Math.max(1, w - 1.5).toFixed(1)}" height="${h}" rx="3" fill="${zoneColor(s.p)}"/>`; x += w; return out; }).join('');

  else if (s.p === 'HILL') paceTxt = 'Hard effort';
  else if (s.p === 'E' || s.p === 'LR') paceTxt = `${pace(pt.Elo)} – ${pace(pt.Ehi)}`.replace(/\/(km|mi) – /, ' – ');
  else if (s.p === 'RC') paceTxt = `slower than ${pace(pt.Ehi)}`;
  else if (s.p === 'STR') paceTxt = 'Fast & relaxed';
  else paceTxt = `${pace(pt[s.p])}`;
  return `<li><span class="bar" style="background:${zoneColor(s.p)}"></span><span style="flex:1;min-width:0"><b>${nice}</b> <span class="muted">${esc(s.label || info.name)}</span><br><span class="tiny muted">${esc(info.name || '')}${info.name ? ' · ' : ''}${esc(info.desc || '')}</span></span><span class="num" style="font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap">${paceTxt}</span></li>`;

const TIPS = {
  easy: 'Use the talk test: if you can’t speak in full sentences, slow down. Most runners do easy runs too fast.',
  recovery: 'Shorter and slower is fine. Swap for a walk or rest if your legs are heavy.',
  long: 'Carry water on runs over 75 min and practise fuelling (a gel or sweets every 30–40 min) on runs over 90 min.',
  tempo: 'Settle into the pace over the first few minutes rather than charging off. Smooth, controlled, rhythmic breathing.',
  intervals: 'Consistency beats heroics: aim for every rep at the same pace. Use the recoveries — they’re part of the session.',
  hills: 'Short steps, quick cadence, drive your arms. Jog down gently — the downhill is your recovery.',
  fartlek: 'Run by feel. The “on” bits are strong but controlled; the “off” bits are genuinely easy.',
  progression: 'Be patient early. The first third should feel almost too easy so the finish feels strong.',
  racepace: 'Lock in and memorise how race pace feels. Practise race-day kit and breakfast on this session.',
  race: 'Start slower than you want to. Even pacing (or a slightly faster second half) almost always gives the best time.',
  runwalk: 'Slow is pro. Run at a pace where you can chat — the goal is time on feet, not speed.',
  strength: 'Quality over quantity. 2 reps in reserve, controlled lowering, and stop if anything pinches.',
};
function openWorkout(id) {
  sheetId = id; const r = me(); const w = findW(id); if (!w) return;
  const wk = r.plan.weeks[w.week]; const pt = ptFor(wk, r);
  const t = w.type === 'strength' ? { m: 0, sec: w.mins * 60 } : E.totals(w.steps, pt);
  const st = statusOf(w, r); const log = r.log[id];
  const runSecs = E.flatten(w.steps).filter(s => s.k === 'run');
  const avg = t.m ? t.sec / (t.m / 1000) : 0;
  const days = [...Array(7)].map((_, d) => { const date = E.fmtDate(E.addDays(E.parseDate(wk.start), d)); return `<option value="${d}" ${d === w.day ? 'selected' : ''} ${date < r.profile.startDate ? 'disabled' : ''}>${E.DAYS_LONG[d]} ${E.parseDate(date).getDate()}</option>`; }).join('');
  const body = `
  <div class="whead" style="--tc:${tc(w.type)}">
    <div class="row between"><span class="pill" style="background:rgba(255,255,255,.2);color:#fff">${TYPES[w.type].label}</span><span class="small muted">${niceDate(w.date, { weekday: 'long', day: 'numeric', month: 'long' })}</span></div>
    <h2 style="margin-top:10px;font-size:24px" id="sheet-title">${esc(w.title)}</h2>
    <div class="metrics">${w.type === 'strength' ? `<div><b>${w.mins}m</b><span>Duration</span></div><div><b>${w.items.length}</b><span>Exercises</span></div><div><b>None</b><span>Kit needed</span></div>` : `<div><b>${dist(t.m)}</b><span>Distance</span></div><div><b>${dur(t.sec)}</b><span>Est. time</span></div><div><b>${E.fmtTime(units() === 'mi' ? avg * MI / 1000 : avg)}</b><span>Avg /${units()}</span></div>`}</div>
  </div>
  <div class="card flat" style="margin-top:12px"><h3>Why this session</h3><p class="small" style="margin:6px 0 0">${esc(w.purpose)}</p>${w.note ? `<p class="small" style="margin:8px 0 0"><b>${esc(w.note)}</b></p>` : ''}</div>
  ${w.type === 'strength' ? `<div class="card flat" style="margin-top:12px"><h3>Exercises</h3><ul class="steps">${w.items.map(([n, s]) => `<li><span class="bar" style="background:${tc('strength')}"></span><span style="flex:1"><b>${esc(n)}</b></span><span class="small muted">${esc(s)}</span></li>`).join('')}</ul></div>` :
  `<div class="card flat" style="margin-top:12px"><div class="row between"><h3>Session</h3><span class="tiny muted">${runSecs.length} step${runSecs.length === 1 ? '' : 's'}</span></div>${chartSvg(w.steps, pt)}${stepsHtml(w.steps, pt)}</div>`}

  <div class="card flat no-print" style="margin-top:12px">
    ${st === 'done' ? `<div class="row between"><div><b>Completed</b> <span class="small muted">${log.feel ? '· felt ' + ({ easy: 'easy', right: 'just right', hard: 'hard' })[log.feel] : ''}${log.km ? ' · ' + distKm(log.km) : ''}</span></div><button class="btn ghost" data-sact="undo">Undo</button></div>` :
      st === 'skipped' ? `<div class="row between"><b>Skipped</b><button class="btn ghost" data-sact="undo">Undo</button></div>` : `
      <h3>How did it feel?</h3><p class="tiny muted" style="margin:4px 0 10px">Your feedback adjusts future paces.</p>
      <div class="feel"><button class="btn" data-sact="done" data-feel="easy">Too easy<small>could do more</small></button><button class="btn primary" data-sact="done" data-feel="right">Just right<small style="color:rgba(255,255,255,.8)">on target</small></button><button class="btn" data-sact="done" data-feel="hard">Too hard<small>struggled</small></button></div>
      ${w.type !== 'strength' ? `<label class="f small" for="actkm" style="margin-top:12px">Actual distance (optional, ${units()})</label><input id="actkm" class="input" inputmode="decimal" placeholder="${(t.m / (units() === 'mi' ? MI : 1000)).toFixed(1)}">` : ''}
      <div class="row" style="margin-top:10px;flex-wrap:wrap"><label class="small" for="mvday" style="font-weight:600">Move to</label><select id="mvday" class="input" style="flex:1;min-width:160px">${days}</select><button class="btn ghost" data-sact="skip">Skip</button></div>`}

  showSheet(body);
}
function showSheet(html) {
  closeSheet(true);
  const scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.id = 'scrim';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.id = 'sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true'); sh.setAttribute('aria-labelledby', 'sheet-title');
  sh.innerHTML = `<div class="in"><div class="row between"><span></span><div class="grab" aria-hidden="true"></div><button class="icon-btn" data-sact="close" aria-label="Close" style="width:40px;height:40px">${ICON.x}</button></div>${html}</div>`;
  document.body.append(scrim, sh);
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => { scrim.classList.add('on'); sh.classList.add('on'); });
  scrim.addEventListener('click', () => closeSheet());
  sh.addEventListener('click', e => { const b = e.target.closest('[data-sact]'); if (b) SHEET[b.dataset.sact]?.(b); });
  const mv = $('#mvday', sh); if (mv) mv.addEventListener('change', () => SHEET.move(mv));

function closeSheet(instant) {

}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
const SHEET = {
  close: () => closeSheet(),
  done(b) {
    const r = me(); const w = findW(sheetId); const kmIn = parseFloat(($('#actkm')?.value || '').replace(',', '.'));
    const km = isFinite(kmIn) && kmIn > 0 ? (units() === 'mi' ? kmIn * MI / 1000 : kmIn) : null;
    r.log[sheetId] = { done: true, feel: b.dataset.feel, km, at: new Date().toISOString() };
    const msg = adapt(r, w);
    save(); closeSheet(); render(); toast(msg || (b.dataset.feel === 'hard' ? 'Logged. Tough one — recover well.' : 'Nice work! Session logged.'));
  },
  skip() { const r = me(); r.log[sheetId] = { skipped: true, at: new Date().toISOString() }; save(); closeSheet(); render(); toast('Skipped. One session won’t make or break your plan.'); },
  undo() { const r = me(); delete r.log[sheetId]; save(); openWorkout(sheetId); render(); },
  move(sel) {
    const r = me(); const w = findW(sheetId); const wk = r.plan.weeks[w.week]; const d = +sel.value;
    const oldId = w.id; w.day = d; w.date = E.fmtDate(E.addDays(E.parseDate(wk.start), d)); w.id = w.date + '-' + w.type + (wk.workouts.some(x => x !== w && x.id === w.date + '-' + w.type) ? '-' + uid() : '');

    wk.workouts.sort((a, b) => a.day - b.day);
    sheetId = w.id; save(); render(); openWorkout(w.id);
    const clash = wk.workouts.filter(x => x.day === d && x.type !== 'strength').length > 1;
    toast(clash ? `Moved to ${E.DAYS_LONG[d]} — you now have two runs that day.` : `Moved to ${E.DAYS_LONG[d]}.`);
  },
};
// Adaptive pacing: feedback on quality sessions nudges the fitness score up or down

// ---------- PLAN VIEW ----------
function renderPlan(r) {

  const race = G.race ? E.RACES[G.race] : null;

      `<div class="big" style="margin-top:10px">${ws.length} weeks</div><div class="small muted">${niceDate(ws[0].start)} – ${niceDate(E.fmtDate(E.addDays(E.parseDate(ws[ws.length - 1].start), 6)))}</div>`}
      <div class="grid3" style="margin-top:10px"><div class="stat"><div class="l">Week</div><div class="v">${Math.min(cur + 1, ws.length)}/${ws.length}</div></div><div class="stat"><div class="l">Sessions done</div><div class="v">${done}</div></div><div class="stat"><div class="l">Hit rate</div><div class="v">${total ? Math.round(done / total * 100) + '%' : '—'}</div></div></div>
    </div>

      <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px">${phases.map(p => `<span class="pill ppill phase-${p}">${p}</span>`).join('')}</div></div>

      <div style="min-width:64px"><div style="font-weight:800">Wk ${i + 1}</div><div class="tiny muted">${niceDate(w.start, { day: 'numeric', month: 'short' })}</div></div>
      <div style="flex:1;min-width:0"><div class="row" style="gap:6px;margin-bottom:6px"><span class="pill ppill phase-${w.phase}">${w.phase}${w.cut ? ' · cutback' : ''}</span><span class="tiny muted">${distKm(w.km)}</span></div>

// ---------- PACES VIEW ----------

  },
  import() {

    i.onchange = async () => { try { const d = JSON.parse(await i.files[0].text()); if (d.app !== 'pacer' || !d.runner?.plan) throw 0; const id = uid(); S.profiles[id] = d.runner; S.activeId = id; viewWeek = null; save(); render(); toast(`Restored ${d.runner.profile.name}’s plan`); } catch (e) { toast('That doesn’t look like a Pacer backup file.'); } };

};
function appUrl() { return location.origin + location.pathname; }
function b64(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64(s) { return JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))))); }

}
function downloadIcs() {
  const r = me(); const icsEsc = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');

    return ['BEGIN:VEVENT', `UID:${w.id}-${S.activeId}@pacer`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${end}`, `SUMMARY:${icsEsc((w.type === 'strength' ? '💪 ' : '🏃 ') + w.title)}`, `DESCRIPTION:${icsEsc(w.purpose + '\n\n' + lines.join('\n') + '\n\n' + appUrl())}`, 'TRANSP:TRANSPARENT', 'END:VEVENT'].join('\r\n');

  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'pacer-plan.ics'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Calendar file downloaded — open it to add your sessions.');
}

  const d = ob.d, s = STEPS[ob.step], G = E.GOALS[d.goal] || {};
  const prog = `<div class="row between"><button class="icon-btn" data-ob="back" aria-label="Back" ${ob.step === 0 && !ob.opts.editing && !ob.opts.newRunner ? 'style="visibility:hidden"' : ''}>${ICON.left}</button><span class="small muted">${ob.step ? `Step ${ob.step} of ${STEPS.length - 1}` : ''}</span><span style="width:44px"></span></div>
    ${ob.step ? `<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${STEPS.length - 1}" aria-valuenow="${ob.step}"><i style="width:${ob.step / (STEPS.length - 1) * 100}%"></i></div>` : ''}`;
  let body = '', cta = 'Continue';
  const choice = (key, val, title, desc, extra = '') => `<button class="choice" data-set="${key}" data-val="${esc(val)}" aria-pressed="${String(d[key]) === String(val)}">${extra}<span><span class="ct" style="display:block">${title}</span>${desc ? `<span class="cd">${desc}</span>` : ''}</span></button>`;
  switch (s) {
    case 'welcome': {
      const inv = ob.invite;
      body = `<div class="welcome"><div class="mark">${ICON.logo.replace('width="18" height="18"', 'width="40" height="40"')}</div>
        <h1 style="font-size:36px">Your free running coach</h1>
        <p class="lead" style="font-size:18px;margin:0">A personalised plan for your goal, built around your week and the sessions you actually enjoy. No sign-up, no subscription.</p>
        ${inv ? `<div class="banner"><b>${esc(inv.by)}</b> invited you to train${inv.g && E.GOALS[inv.g] ? ` for ${esc(inv.n || E.GOALS[inv.g].name)}` : ''}${inv.d ? ` on ${niceDate(inv.d, { day: 'numeric', month: 'long', year: 'numeric' })}` : ''}. We’ve pre-filled the race for you.</div>` : ''}
        <div class="stack" style="margin-top:8px">
          <div class="feat"><span class="fi">${ICON.week}</span><div><b>Plans that fit your life</b><div class="small muted">Pick your run days, long-run day and how much time you have on weekdays.</div></div></div>
          <div class="feat"><span class="fi">${ICON.paces}</span><div><b>Personal paces for every session</b><div class="small muted">Easy, tempo, intervals, hills — calculated from your current fitness.</div></div></div>
          <div class="feat"><span class="fi">${ICON.plan}</span><div><b>Adapts as you go</b><div class="small muted">Tell us how sessions felt and your paces adjust.</div></div></div>
        </div></div>`;
      cta = ob.opts.editing ? 'Edit my plan' : 'Build my plan'; break;
    }
    case 'name':
      body = `<h1>First things first</h1><p class="lead">What should your coach call you?</p>
        <label class="f" for="nm">Your name</label><input id="nm" class="input" data-bind="name" value="${esc(d.name)}" autocomplete="given-name" placeholder="e.g. Rich" maxlength="30">
        <div style="margin-top:20px"><label class="f">Units</label><div class="seg" role="group" aria-label="Units"><button data-set="units" data-val="km" aria-pressed="${d.units === 'km'}">Kilometres</button><button data-set="units" data-val="mi" aria-pressed="${d.units === 'mi'}">Miles</button></div></div>`; break;
    case 'goal':
      body = `<h1>What are you training for?</h1><p class="lead">Pick a distance — you can change it any time.</p><div class="choices">
        ${choice('goal', 'start', 'Start running', 'From zero to running 5K non-stop with run/walk', `<span class="badge" style="background:${tc('runwalk')}">NEW</span>`)}
        ${choice('goal', '5k', '5K', 'Get faster at parkrun or smash a 5K PB', `<span class="badge" style="background:${tc('intervals')}">5K</span>`)}
        ${choice('goal', '10k', '10K', 'Build speed and stamina for 10K', `<span class="badge" style="background:${tc('tempo')}">10K</span>`)}
        ${choice('goal', 'half', 'Half marathon', '21.1 km — the perfect challenge', `<span class="badge" style="background:${tc('fartlek')}">HM</span>`)}
        ${choice('goal', 'marathon', 'Marathon', '42.2 km — the big one', `<span class="badge" style="background:${tc('long')}">M</span>`)}
        ${choice('goal', 'fitness', 'Get fitter', 'No race — just run consistently and improve', `<span class="badge" style="background:${tc('easy')}">FIT</span>`)}
        </div>`; break;
    case 'level':
      if (d.goal === 'start') { body = `<h1>Starting from scratch</h1><p class="lead">Perfect. Your plan starts with short run/walk intervals and builds to 30 minutes of continuous running — about 5K.</p><div class="card flat"><b>Before you start</b><p class="small muted" style="margin:6px 0 0">Comfy trainers, a route without too many hills and permission to go slowly. If you have any health concerns, check with your GP first.</p></div>`; break; }
      body = `<h1>How would you describe your running?</h1><p class="lead">Be honest — the right level gives you the right plan.</p><div class="choices">
        ${choice('level', 'beginner', 'Beginner', 'I can run 5K (maybe with walk breaks). I run now and then.')}
        ${choice('level', 'intermediate', 'Intermediate', 'I run 2–4 times a week and can run 5–10K comfortably.')}
        ${choice('level', 'advanced', 'Advanced', 'I run 4+ times a week, regularly run 10K+, and have done some speed work.')}
        ${choice('level', 'elite', 'Elite', 'I train seriously and structured, 5–7 days a week, racing regularly.')}
        </div>`; break;
    case 'current': {
      const wk = d.weeklyKm ?? [8, 20, 35, 55][Math.max(0, E.LEVELS.indexOf(d.level))];
      const lg = d.longestKm ?? [5, 8, 14, 18][Math.max(0, E.LEVELS.indexOf(d.level))];
      const f = units() === 'mi' || d.units === 'mi' ? 1 / 1.609344 : 1, u = d.units;
      if (d.goal === 'start') { body = `<h1>Where are you now?</h1><p class="lead">No pressure — this just sets the starting point.</p><div class="choices">${choice('level', 'beginner', 'I don’t run at all yet', 'We’ll start with 1 minute running, 90 seconds walking')}</div>`; break; }
      body = `<h1>Your running right now</h1><p class="lead">We use this to set a safe starting volume.</p>
        <div class="card flat"><label class="f" for="wkm">Average weekly distance (last 4 weeks)</label><div class="rangeval"><span id="wkmv">${Math.round(wk * f)}</span> <span class="small muted">${u}/week</span></div><input type="range" class="range" id="wkm" data-bind="weeklyKm" data-num="1" data-f="${f}" min="0" max="${Math.round(120 * f)}" step="1" value="${Math.round(wk * f)}"></div>
        <div class="card flat" style="margin-top:10px"><label class="f" for="lgm">Longest run in the last month</label><div class="rangeval"><span id="lgmv">${Math.round(lg * f)}</span> <span class="small muted">${u}</span></div><input type="range" class="range" id="lgm" data-bind="longestKm" data-num="1" data-f="${f}" min="0" max="${Math.round(35 * f)}" step="1" value="${Math.round(lg * f)}"></div>
        <div class="card flat" style="margin-top:10px"><b>Recent race or time trial</b> <span class="small muted">(optional, best within 3 months)</span><p class="tiny muted" style="margin:4px 0 10px">The most accurate way to set your paces. Skip it and we’ll estimate from your level.</p>
          <div class="grid2"><div><label class="f" for="rdist">Distance</label><select id="rdist" class="input" data-bind="recentDist">${[['1 mile', 1609.344], ['5K', 5000], ['10K', 10000], ['Half marathon', 21097.5], ['Marathon', 42195]].map(([n, m]) => `<option value="${m}" ${+d.recentDist === m ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
          <div><label class="f" for="rtime">Time</label><input id="rtime" class="input" data-bind="recentTime" value="${esc(d.recentTime)}" placeholder="mm:ss or h:mm:ss" inputmode="numeric"></div></div>
          <p class="small" id="rhint" style="margin:10px 0 0;color:var(--brand);font-weight:600"></p></div>`;
      if (d.weeklyKm == null) d.weeklyKm = wk; if (d.longestKm == null) d.longestKm = lg;
      break;
    }
    case 'race': {
      if (!G.race || d.goal === 'start') {
        const w = d.weeks || G.weeks;
        body = `<h1>How long is your plan?</h1><p class="lead">${d.goal === 'start' ? '9 weeks is the classic couch-to-5K length. Go longer if you want a gentler build.' : 'Pick a block length. When it ends you can build another.'}</p>
          <div class="card flat"><div class="rangeval"><span id="wv">${w}</span> <span class="small muted">weeks</span></div><input type="range" class="range" data-bind="weeks" data-num="1" id="wks" min="${G.min}" max="${G.max}" value="${w}"></div>
          <div style="margin-top:16px"><label class="f" for="sd">Start date</label><input type="date" id="sd" class="input" data-bind="startDate" value="${d.startDate}" min="${todayStr()}"></div>`;
        if (d.goal === 'start') body += `<div style="margin-top:16px"><label class="f" for="rn">Target event (optional)</label><input id="rn" class="input" data-bind="raceName" value="${esc(d.raceName)}" placeholder="e.g. My first parkrun"></div>`;
        break;
      }
      const sw = d.raceDate ? E.addDays(E.parseDate(d.raceDate), 0) : null;
      const wks = sw ? Math.round((E.mondayOf(sw) - E.mondayOf(E.parseDate(d.startDate))) / 6048e5) + 1 : null;
      body = `<h1>Your race</h1><p class="lead">Got a date? We’ll build backwards from race day. No date yet? Pick a plan length.</p>
        <label class="f" for="rdt">Race date</label><input type="date" id="rdt" class="input" data-bind="raceDate" value="${d.raceDate}" min="${E.fmtDate(E.addDays(new Date(), 7))}">
        <p class="small" style="margin:8px 0 0" id="rwk">${wks ? (wks < G.min ? `<span style="color:var(--warn);font-weight:600">${wks} weeks — tight, but we’ll make it work. ${G.min}+ is ideal.</span>` : `<span class="muted">${wks}-week plan</span>`) : ''}</p>
        ${!d.raceDate ? `<div class="card flat" style="margin-top:12px"><label class="f" for="wks">Or plan length</label><div class="rangeval"><span id="wv">${d.weeks || G.weeks}</span> <span class="small muted">weeks</span></div><input type="range" class="range" data-bind="weeks" data-num="1" id="wks" min="${G.min}" max="${G.max}" value="${d.weeks || G.weeks}"></div>` : ''}
        <div class="grid2" style="margin-top:16px"><div><label class="f" for="rn">Race name (optional)</label><input id="rn" class="input" data-bind="raceName" value="${esc(d.raceName)}" placeholder="e.g. Great North Run"></div>
        <div><label class="f" for="gt">Goal time (optional)</label><input id="gt" class="input" data-bind="goalTime" value="${esc(d.goalTime)}" placeholder="${G.race === 'marathon' ? '3:59:00' : G.race === 'half' ? '1:55:00' : G.race === '10k' ? '52:00' : '25:00'}" inputmode="numeric"></div></div>
        <p class="tiny muted" style="margin:6px 0 0">Leave goal time blank and we’ll set an ambitious-but-realistic target.</p>
        <div style="margin-top:16px"><label class="f" for="sd">Start date</label><input type="date" id="sd" class="input" data-bind="startDate" value="${d.startDate}" min="${todayStr()}"></div>`;
      break;
    }
    case 'schedule': {
      const lim = [[null, 'No limit'], [30, '30 min'], [45, '45 min'], [60, '60 min'], [75, '75 min'], [90, '90 min']];
      body = `<h1>Your week</h1><p class="lead">Which days can you run? We’ll put rest days and hard sessions in the right places.</p>
        <label class="f">Run days <span class="muted small">(${d.days.length} selected${d.goal === 'start' ? ', 3 is ideal' : ''})</span></label>
        <div class="chips" role="group" aria-label="Run days">${E.DAYS.map((n, i) => `<button class="chip" data-day="${i}" aria-pressed="${d.days.includes(i)}">${n}</button>`).join('')}</div>
        ${d.days.length < 2 ? '<p class="small" style="color:var(--warn);margin:8px 0 0">Pick at least 2 days.</p>' : d.days.length >= 6 && d.level === 'beginner' ? '<p class="small" style="color:var(--warn);margin:8px 0 0">That’s a lot for a beginner — 3–4 days with rest between is usually better.</p>' : ''}
        ${d.goal !== 'start' ? `<div style="margin-top:20px"><label class="f">Long run day</label><div class="chips" role="group" aria-label="Long run day">${d.days.map(i => `<button class="chip" data-set="longDay" data-val="${i}" aria-pressed="${+d.longDay === i}">${E.DAYS[i]}</button>`).join('')}</div></div>
        <div style="margin-top:20px"><label class="f">Max time for weekday runs</label><p class="tiny muted" style="margin:-2px 0 8px">Busy mornings? We’ll keep Monday–Friday sessions within this.</p><div class="chips" role="group" aria-label="Weekday time limit">${lim.map(([v, n]) => `<button class="chip" data-set="weekdayMax" data-val="${v ?? ''}" aria-pressed="${String(d.weekdayMax ?? '') === String(v ?? '')}">${n}</button>`).join('')}</div></div>` : ''}`;
      break;
    }
    case 'likes': {
      if (d.goal === 'start') { body = `<h1>Extras</h1><p class="lead">Strength work makes new runners far less likely to get injured.</p>${strengthBlock(d)}`; break; }
      body = `<h1>What do you enjoy?</h1><p class="lead">We’ll do more of what you love and less of what you don’t. (We may still sneak in the odd one — they work!)</p>
        <div class="card flat">${PREF_LIST.map(([k, n, desc]) => `<div class="pref"><span style="min-width:0"><b>${n}</b><br><span class="tiny muted">${desc}</span></span><div class="seg" role="group" aria-label="${n}">${[['avoid', 'Less'], ['ok', 'OK'], ['love', 'Love']].map(([v, l]) => `<button data-pref="${k}" data-val="${v}" aria-pressed="${(d.prefs[k] || 'ok') === v}">${l}</button>`).join('')}</div></div>`).join('')}</div>
        <div style="margin-top:20px"><label class="f">Where you run</label><div class="seg" role="group" aria-label="Terrain">${[['flat', 'Mostly flat'], ['mixed', 'Mixed'], ['hilly', 'Hilly']].map(([v, l]) => `<button data-set="terrain" data-val="${v}" aria-pressed="${d.terrain === v}">${l}</button>`).join('')}</div></div>
        ${strengthBlock(d)}`;
      break;
    }
    case 'summary': {
      const p = profileFromOb(); let plan;
      try { plan = E.generate(p); } catch (e) { console.error(e); }
      const race = G.race ? E.RACES[G.race] : null;
      const pt = plan ? E.paceTable(plan.curV, plan.goalPace) : null;
      const unitsBak = me()?.profile.units; // format using chosen units
      const fmtP = spk => E.fmtTime(d.units === 'mi' ? spk * MI / 1000 : spk) + '/' + d.units;
      body = `<h1>${ob.opts.editing ? 'Your updated plan' : `Ready, ${esc(d.name.trim())}!`}</h1><p class="lead">Here’s what we’ve built for you.</p>
        <div class="card hero"><div class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.08em">${esc(p.raceName || G.name)}</div>
          <div class="big" style="margin-top:8px">${plan.weeks.length} weeks</div><div class="small muted">${p.days.length} runs a week · starts ${niceDate(p.startDate, { weekday: 'short', day: 'numeric', month: 'short' })}</div>
          ${race && d.goal !== 'start' ? `<div class="grid2" style="margin-top:14px"><div class="stat"><div class="l">Estimated finish</div><div class="v">${E.fmtTime(plan.goalSec || E.predict(plan.goalV, race.m))}</div></div><div class="stat"><div class="l">Race pace</div><div class="v">${fmtP(plan.goalPace)}</div></div></div>` : ''}
          <div class="grid2" style="margin-top:10px"><div class="stat"><div class="l">Peak week</div><div class="v">${(Math.max(...plan.weeks.map(w => w.km)) / (d.units === 'mi' ? 1.609344 : 1)).toFixed(0)} ${d.units}</div></div><div class="stat"><div class="l">${d.goal === 'start' ? 'Finish with' : 'Easy pace'}</div><div class="v">${d.goal === 'start' ? '30 min run' : fmtP(pt.E)}</div></div></div></div>
        ${plan.warnings.map(w => `<div class="warn" style="margin-top:10px">${esc(w)}</div>`).join('')}
        <div class="card flat" style="margin-top:12px"><h3>Your first week</h3><ul class="steps">${plan.weeks[0].workouts.map(w => `<li><span class="bar" style="background:${tc(w.type)}"></span><span style="flex:1"><b>${E.DAYS[w.day]}</b> · ${esc(w.title)}</span></li>`).join('') || '<li>Rest up — your plan starts next week.</li>'}</ul></div>`;
      cta = ob.opts.editing ? 'Save changes' : 'Start my plan';
      void unitsBak;
      break;
    }
  }
  return `<div class="ob">${prog}<div class="body">${body}</div><div class="foot">${ob.step > 0 ? '' : (ob.opts.editing || ob.opts.newRunner) && me() ? '<button class="btn" data-ob="cancel">Cancel</button>' : ''}<button class="btn primary" data-ob="next" ${stepValid() ? '' : 'disabled'}>${cta}</button></div></div>`;
}
function strengthBlock(d) { return `<div style="margin-top:20px"><label class="f">Strength &amp; mobility sessions</label><p class="tiny muted" style="margin:-2px 0 8px">20–30 min bodyweight routines that make you faster and more injury-resistant.</p><div class="chips" role="group" aria-label="Strength sessions per week">${[[0, 'None'], [1, '1 / week'], [2, '2 / week']].map(([v, l]) => `<button class="chip" data-set="strength" data-val="${v}" aria-pressed="${+d.strength === v}">${l}</button>`).join('')}</div></div>`; }
function bindOnboarding() {
  const d = ob.d;
  const refreshBtn = () => { const b = $('[data-ob="next"]'); if (b) b.disabled = !stepValid(); };
  $$('[data-set]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.set; let v = b.dataset.val;
    if (k === 'longDay' || k === 'strength') v = +v; if (k === 'weekdayMax') v = v ? +v : null;
    d[k] = v; if (k === 'goal' && v === 'start') d.level = 'beginner';
    if (k === 'goal') { d.weeks = null; }
    const y = window.scrollY; render(); window.scrollTo(0, y);
    if (['goal', 'level'].includes(k) && !ob.opts.editing) setTimeout(() => { if (stepValid()) advance(); }, 180);
  }));
  $$('[data-pref]').forEach(b => b.addEventListener('click', () => { d.prefs = { ...d.prefs, [b.dataset.pref]: b.dataset.val }; const y = window.scrollY; render(); window.scrollTo(0, y); }));
  $$('[data-day]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.day; d.days = d.days.includes(i) ? d.days.filter(x => x !== i) : [...d.days, i].sort((a, b) => a - b);
    if (!d.days.includes(+d.longDay)) d.longDay = d.days.includes(6) ? 6 : d.days.includes(5) ? 5 : d.days[d.days.length - 1] ?? 6;
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }));
  $$('[data-bind]').forEach(inp => {
    const k = inp.dataset.bind;
    const upd = () => {
      let v = inp.value;
      if (inp.dataset.num) { v = +v; if (inp.dataset.f) v = Math.round(v / +inp.dataset.f * 10) / 10; }
      d[k] = v;
      if (k === 'weeklyKm') $('#wkmv').textContent = inp.value;
      if (k === 'longestKm') $('#lgmv').textContent = inp.value;
      if (k === 'weeks') $('#wv').textContent = inp.value;
      if (k === 'recentTime' || k === 'recentDist') hint();
      if (k === 'raceDate') { const y = window.scrollY; render(); window.scrollTo(0, y); const el = $('#rdt'); el && el.focus(); return; }
      refreshBtn();
    };
    inp.addEventListener(inp.type === 'range' || inp.tagName === 'SELECT' || inp.type === 'date' ? 'change' : 'input', upd);
    if (inp.type === 'range') inp.addEventListener('input', upd);
  });
  function hint() { const h = $('#rhint'); if (!h) return; const s = E.parseTime(d.recentTime); if (!s) { h.textContent = ''; return; } const v = E.vdotFrom(+d.recentDist, s); h.textContent = v > 15 && v < 90 ? `Fitness score ${v.toFixed(1)} · predicts 5K ${E.fmtTime(E.predict(v, 5000))}, 10K ${E.fmtTime(E.predict(v, 10000))}, half ${E.fmtTime(E.predict(v, 21097.5))}` : 'Check that time — it looks unusual.'; }
  hint();
  $('[data-ob="next"]')?.addEventListener('click', advance);
  $('[data-ob="back"]')?.addEventListener('click', () => { if (ob.step === 0 || (ob.opts.editing && ob.step <= 2)) { if (me()) { ob.active = false; render(); } return; } ob.step--; render(); window.scrollTo({ top: 0 }); });
  $('[data-ob="cancel"]')?.addEventListener('click', () => { ob.active = false; render(); });
  const nm = $('#nm'); if (nm) { nm.focus(); nm.addEventListener('keydown', e => { if (e.key === 'Enter' && stepValid()) advance(); }); }
}
function advance() {
  if (!stepValid()) return;
  if (STEPS[ob.step] === 'summary') return finishOnboarding();
  ob.step++; render(); window.scrollTo({ top: 0 });
}
function finishOnboarding() {
  const p = profileFromOb(); const plan = E.generate(p);
  if (ob.opts.editing && me()) {
    const r = me(); r.profile = p; r.plan = plan; r.adj = r.adj || 0;
  } else {
    const id = uid(); S.profiles[id] = { profile: p, plan, log: {}, adj: 0, created: todayStr() }; S.activeId = id;
  }
  ob.active = false; ob.invite = null; viewWeek = null; tab = 'week';
  if (location.hash) history.replaceState(null, '', location.pathname);
  save(); render(); window.scrollTo({ top: 0 });
  toast(ob.opts.editing ? 'Plan updated — completed sessions kept.' : `Plan built! Welcome aboard, ${p.name}.`);
}

// paces calculator live binding (delegated)
function calcUpdate(e) {
  if (e.target.id !== 'ct' && e.target.id !== 'cd') return;
  calc.t = $('#ct').value; calc.d = +$('#cd').value; const s = E.parseTime(calc.t);
  $('#calcout').textContent = s ? `${pace(s / (calc.d / 1000))} · VDOT ${E.vdotFrom(calc.d, s).toFixed(1)}` : '—';
}
document.addEventListener('input', calcUpdate);
document.addEventListener('change', calcUpdate);

// ---------- boot ----------
function boot() {
  const m = location.hash.match(/invite=([\w-]+)/);
  if (m) { try { ob.invite = unb64(m[1]); } catch (e) {} }
  if (ob.invite) {
    const inv = ob.invite; const pre = {};
    if (E.GOALS[inv.g]) pre.goal = inv.g; if (inv.d && inv.d > todayStr()) pre.raceDate = inv.d; if (inv.n) pre.raceName = String(inv.n).slice(0, 60);
    if (me()) { if (confirm(`${inv.by} invited you to train with Pacer. Create a new plan for this invite? (Your existing plan stays saved.)`)) startOnboarding(pre, { newRunner: true }); else { history.replaceState(null, '', location.pathname); render(); } return; }
    startOnboarding(pre, {}); return;
  }
  if (!me()) startOnboarding({}, {});
  else render();
}
boot();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
