<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pacer — free running coach</title>
<meta name="description" content="Free, personalised running plans for 5K, 10K, half and full marathon. Built around your week and the sessions you enjoy.">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Pacer — free running coach">
<meta property="og:description" content="Personalised running plans built around your week. Free, no sign-up.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#eef0f4; --text:#0f1218; --muted:#5b6474; --line:#e2e5eb;
  --brand:#5b5bf7; --brand-2:#8b5cf6; --brand-ink:#ffffff; --brand-solid:#4f46e5; --ok:#15803d; --warn:#d97706; --warn-ink:#a16207; --bad:#dc2626; --field:#8a93a3; --t-ink:#ffffff;
  --shadow:0 1px 2px rgba(15,18,24,.06),0 4px 16px rgba(15,18,24,.06);
  --r:16px; --r-sm:10px;
  --t-easy:#15803d; --t-recovery:#0f766e; --t-long:#2563eb; --t-tempo:#c2410c; --t-intervals:#e11d48; --t-hills:#a16207;
  --t-fartlek:#9333ea; --t-progression:#a16207; --t-racepace:#db2777; --t-race:#b45309; --t-runwalk:#047857; --t-strength:#475569;
  --z0:#64748b; --z1:#14b8a6; --z2:#22c55e; --z3:#eab308; --z4:#f97316; --z5:#f43f5e;
  --ph-Base:#60a5fa; --ph-Build:#a78bfa; --ph-Peak:#f472b6; --ph-Taper:#34d399; --ph-Race:#fbbf24;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d12; --surface:#151821; --surface-2:#1d212c; --text:#eef1f6; --muted:#9aa3b2; --line:#272c38;
    --brand:#7c7cff; --brand-2:#a78bfa; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --brand-solid:#4f46e5; --warn-ink:#fbbf24; --field:#5c6577; --t-ink:#0b0d12; --ok:#22c55e; --z0:#94a3b8; --z1:#5eead4; --z2:#4ade80; --z3:#facc15; --z4:#fb923c; --z5:#fb7185;
    --t-easy:#22c55e; --t-recovery:#2dd4bf; --t-long:#60a5fa; --t-tempo:#fb923c; --t-intervals:#fb7185; --t-hills:#d4a72c;
    --t-fartlek:#c084fc; --t-progression:#facc15; --t-racepace:#f472b6; --t-race:#fbbf24; --t-runwalk:#34d399; --t-strength:#94a3b8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d12; --surface:#151821; --surface-2:#1d212c; --text:#eef1f6; --muted:#9aa3b2; --line:#272c38;
  --brand:#7c7cff; --brand-2:#a78bfa; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --brand-solid:#4f46e5; --warn-ink:#fbbf24; --field:#5c6577; --t-ink:#0b0d12; --ok:#22c55e; --z0:#94a3b8; --z1:#5eead4; --z2:#4ade80; --z3:#facc15; --z4:#fb923c; --z5:#fb7185;
  --t-easy:#22c55e; --t-recovery:#2dd4bf; --t-long:#60a5fa; --t-tempo:#fb923c; --t-intervals:#fb7185; --t-hills:#d4a72c;
  --t-fartlek:#c084fc; --t-progression:#facc15; --t-racepace:#f472b6; --t-race:#fbbf24; --t-runwalk:#34d399; --t-strength:#94a3b8;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{line-height:1.15;margin:0}
h1{font-size:28px;letter-spacing:-.02em}
h2{font-size:20px;letter-spacing:-.01em}
h3{font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card.flat{box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;min-height:44px;transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--brand-solid),#7c3aed);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);letter-spacing:.02em}
.pill.brand{background:color-mix(in srgb,var(--brand) 15%,transparent);color:var(--brand)}
.badge{display:inline-grid;place-items:center;min-width:40px;height:40px;padding:0 6px;border-radius:12px;font-weight:800;font-size:11px;letter-spacing:.04em;color:var(--t-ink);background:var(--tc);flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.logo-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center}
.avatar{width:36px;height:36px;border-radius:999px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;border:1px solid var(--line)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);min-height:52px;border-radius:12px}
nav.tabs button[aria-current="page"]{color:var(--brand)}
nav.tabs svg{width:24px;height:24px}

/* week strip */
.weekhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ring{width:76px;height:76px;flex:none}
.days{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.day{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.day .dl{text-align:center;padding-top:10px}
.day .dl .d{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day .dl .n{font-size:20px;font-weight:800}
.day.today .dl .n{color:var(--brand)}
.day.today .dl .d{color:var(--brand)}
.wk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.wk + .wk{margin-top:8px}
.wk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.wk .t{font-weight:700}
.wk .m{font-size:13px;color:var(--muted)}
.wk .st{margin-left:auto;flex:none}
.wk.done{background:color-mix(in srgb,var(--ok) 7%,var(--surface))}
.wk.skipped{border-style:dashed;box-shadow:none}
.wk.skipped .t{color:var(--muted)}
.wk.missed .st{color:var(--bad)}
.wk.today{outline:2px solid var(--brand);outline-offset:-1px}
.rest{padding:12px 14px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:14px}
.check{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--ok);color:var(--t-ink)}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.skip{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}

/* coach card */
.coach{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 14%,var(--surface)),var(--surface));}
.coach .who{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-weight:700}

/* plan */
.chart{width:100%;height:150px;display:block}
.weekrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.weekrow + .weekrow{margin-top:8px}
.weekrow.cur{outline:2px solid var(--brand)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:999px;background:var(--tc)}
.dot.done{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--tc)}
.phase-Base{--pc:var(--ph-Base)}.phase-Build{--pc:var(--ph-Build)}.phase-Peak{--pc:var(--ph-Peak)}.phase-Taper{--pc:var(--ph-Taper)}.phase-Race{--pc:var(--ph-Race)}
.ppill{background:color-mix(in srgb,var(--pc) 20%,transparent);color:var(--text)}
.hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#8b5cf6 0%,#5b5bf7 40%,#1e1b4b 100%);border:0}
.hero .muted{color:rgba(255,255,255,.75)}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat{background:var(--surface-2);border-radius:12px;padding:12px}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.hero .stat{background:rgba(255,255,255,.12)}
.hero .stat .l{color:rgba(255,255,255,.75)}

/* tables */
table{width:100%;border-collapse:collapse}
td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.zsw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.celebrate{background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 18%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.info{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:99px;border:1px solid currentColor;font-size:12px;font-weight:800;opacity:.8;margin-left:6px;vertical-align:middle}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .range{flex:1}

/* forms */
label.f{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.input,select.input{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--field);background:var(--surface);font-size:16px}
.input:focus{outline:2px solid var(--brand);border-color:transparent}
.input[aria-invalid="true"]{border-color:var(--bad);border-width:2px}
.err{color:var(--bad);font-weight:600;font-size:13px;margin:6px 0 0}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px 16px;border-radius:var(--r);border:1.5px solid var(--field);background:var(--surface);min-height:56px}
.choice .ct{font-weight:700}
.choice .cd{font-size:13px;color:var(--muted)}
.choice[aria-pressed="true"],.choice[aria-checked="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--surface))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--field);background:var(--surface);border-radius:999px;padding:10px 14px;font-weight:700;min-height:44px;min-width:52px}
.chip[aria-pressed="true"]{border-color:var(--brand-solid);background:var(--brand-solid);color:#fff}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:10px 14px;font-weight:700;font-size:14px;min-height:44px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.pref{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pref:last-child{border-bottom:0}
.range{width:100%;accent-color:var(--brand);height:32px}
.rangeval{font-size:28px;font-weight:800;letter-spacing:-.02em}

/* onboarding */
.ob{min-height:100vh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.ob .progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:6px 0 24px}
.ob .progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:999px;transition:width .3s}
.ob .body{flex:1}
.ob .foot{display:flex;gap:10px;margin-top:24px;position:sticky;bottom:0;padding:12px 0 0;background:linear-gradient(transparent,var(--bg) 30%)}
.ob .foot .btn.primary{flex:1}
.ob h1{margin-bottom:8px}
.ob .lead{color:var(--muted);margin:0 0 20px}
.welcome{display:flex;flex-direction:column;justify-content:center;min-height:70vh;gap:16px}
.welcome .mark{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;box-shadow:0 12px 40px color-mix(in srgb,var(--brand) 45%,transparent)}
.feat{display:flex;gap:12px;align-items:flex-start}
.feat .fi{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);display:grid;place-items:center;flex:none}
.banner{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--brand) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);font-size:14px}
.warn{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);font-size:14px;color:var(--text)}
.warn-ink{color:var(--warn-ink)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,7,12,.5);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);z-index:41;border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .25s ease;padding:0 0 calc(20px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet .in{max-width:720px;margin:0 auto;padding:8px 16px 0}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 10px}
@media (min-width:760px){.sheet{left:50%;right:auto;width:680px;transform:translate(-50%,110%);bottom:24px;border-radius:24px;max-height:86vh}.sheet.on{transform:translate(-50%,0)}}
.whead{padding:18px;border-radius:var(--r);color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 62%,#000),color-mix(in srgb,var(--tc) 35%,#000))}
.whead .muted{color:rgba(255,255,255,.8)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.metrics div{background:rgba(255,255,255,.15);border-radius:12px;padding:10px}
.metrics b{display:block;font-size:20px;letter-spacing:-.02em}
.metrics span{font-size:12px;opacity:.85}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps .bar{width:6px;align-self:stretch;border-radius:9px;flex:none}
.steps .rep{border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:8px 0;background:var(--surface)}
.steps .rep .rh{font-weight:800;font-size:13px;color:var(--brand);padding:6px 0 0}
.svgchart{width:100%;height:64px;display:block;margin-top:6px}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel .btn{border-radius:14px;flex-direction:column;gap:2px;padding:10px 6px;min-height:64px;font-size:14px}
.feel .btn small{font-weight:500;color:var(--muted);font-size:12px}
.toast{display:flex;align-items:center;gap:12px;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:all .25s;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast button{background:transparent;border:0;color:inherit;font-weight:800;text-decoration:underline;min-height:44px;padding:0 4px}
.toast:not(.on){pointer-events:none}
.empty{text-align:center;padding:32px 16px}
details summary{cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";float:right;color:var(--muted)}
details[open] summary::after{content:"－"}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){h1{font-size:24px}.metrics b{font-size:17px}.hero .big{font-size:32px}}
@media print{nav.tabs,.topbar .row,.no-print{display:none!important}.wrap{padding:0}.card,.wk{box-shadow:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>

<script>
(() => {
'use strict';
const E = Engine;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v, d = 0) => (isFinite(+v) ? +v : d);
const KEY = 'pacer.v1';
const TYPES = {
  easy: { label: 'Easy run', ab: 'EZ' }, recovery: { label: 'Recovery run', ab: 'REC' }, long: { label: 'Long run', ab: 'LR' },
  tempo: { label: 'Tempo', ab: 'TMP' }, intervals: { label: 'Intervals', ab: 'INT' }, hills: { label: 'Hills', ab: 'HILL' },
  fartlek: { label: 'Fartlek', ab: 'FK' }, progression: { label: 'Progression', ab: 'PRO' }, racepace: { label: 'Race pace', ab: 'RP' },
  race: { label: 'Race', ab: 'RACE' }, runwalk: { label: 'Run / walk', ab: 'R/W' }, strength: { label: 'Strength', ab: 'STR' },
};
const QUALITY = new Set(['tempo', 'intervals', 'hills', 'fartlek', 'progression', 'racepace']);
const tc = t => `var(--t-${TYPES[t] ? t : 'easy'})`;
const svg = (d, w = 20, sw = 2) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  week: svg('<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>', 24),
  plan: svg('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', 24),
  paces: svg('<circle cx="12" cy="13" r="8"/><path d="M12 13l4-3M9 2h6"/>', 24),
  me: svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>', 24),

// ---------- storage ----------
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.profiles && typeof s.profiles === 'object') return s; } catch (e) {}
  return { activeId: null, profiles: {}, theme: null };
}
let S = load();
let storageWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { if (!storageWarned) { storageWarned = true; toast('Your browser is blocking storage — progress won’t be saved on this device.', { ms: 6000 }); } }
}
const me = () => (S.activeId && S.profiles[S.activeId]) || null;
const uid = () => Math.random().toString(36).slice(2, 10);
const adjOf = (r = me()) => num(r.base) + num(r.fb) + num(r.adj); // r.adj kept for older saves

// ---------- units & formatting ----------
let unitOverride = null;
const units = () => unitOverride || (me()?.profile.units) || 'km';
const MI = 1609.344;
function dist(m, d = 1) { if (units() === 'mi') return (m / MI).toFixed(d).replace(/\.0+$/, '') + ' mi'; return (m / 1000).toFixed(d).replace(/\.0+$/, '') + ' km'; }
function distKm(km, d = 1) { return dist(km * 1000, d); }
const pv = spk => (units() === 'mi' ? spk * MI / 1000 : spk);
function pace(spk) { return E.fmtTime(pv(spk)) + '/' + units(); }
function paceRange(a, b) { return E.fmtTime(pv(a)) + '–' + E.fmtTime(pv(b)) + '/' + units(); }
function dur(sec) { const m = Math.round(sec / 60); if (m < 60) return m + ' min'; return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm'; }
function fmtTitle(t) { if (units() !== 'mi') return t; return String(t).replace(/(\d+(?:\.\d+)?) ?km\b/g, (m0, n) => (+n < 2 ? m0 : (n / 1.609344).toFixed(1).replace(/\.0$/, '') + ' mi')); }
const todayStr = () => E.fmtDate(new Date());
function niceDate(s, opts = { weekday: 'short', day: 'numeric', month: 'short' }) { try { return E.parseDate(s).toLocaleDateString('en-GB', opts); } catch (e) { return ''; } }
function daysBetween(a, b) { return Math.round((E.parseDate(b) - E.parseDate(a)) / 864e5); }

// ---------- toast (with optional action) ----------
function toast(msg, o = {}) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${o.action ? `<button type="button">${esc(o.action)}</button>` : ''}`;
  if (o.action) t.querySelector('button').onclick = () => { t.classList.remove('on'); o.fn(); };
  t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), o.ms || (o.action ? 5500 : 3000));
}

// ---------- plan helpers ----------
function curWeekIndex(r = me()) {
  if (!r) return 0;
  const t = todayStr(), ws = r.plan.weeks;
  if (t < ws[0].start) return 0;
  for (let i = 0; i < ws.length; i++) { const end = E.fmtDate(E.addDays(E.parseDate(ws[i].start), 6)); if (t <= end) return i; }
  return ws.length - 1;
}
function ptFor(week, r = me()) { return E.paceTable(week.v + adjOf(r), r.plan.goalPace, r.plan.goalFb || 'HM'); }
function allWorkouts(r = me()) { return r.plan.weeks.flatMap(w => w.workouts); }
function statusOf(w, r = me()) {
  const l = r.log[w.id];
  if (l && l.done) return 'done';
  if (l && l.skipped) return 'skipped';
  if (w.date < todayStr()) return 'missed';
  if (w.date === todayStr()) return 'today';
  return 'upcoming';
}
function vdotNow(r = me()) { const w = r.plan.weeks[curWeekIndex(r)]; return w.v + adjOf(r); }
function wTotals(w, r = me()) { return w.type === 'strength' ? { m: 0, sec: num(w.mins, 20) * 60 } : E.totals(w.steps, ptFor(r.plan.weeks[w.week], r)); }
function hitRate(r = me()) { const due = allWorkouts(r).filter(w => w.type !== 'strength' && w.date < todayStr()); return due.length ? Math.round(due.filter(w => r.log[w.id]?.done).length / due.length * 100) : null; }
function streakOf(r = me()) {
  let n = 0; const ci = curWeekIndex(r);
  for (let i = ci; i >= 0; i--) {
    const runs = r.plan.weeks[i].workouts.filter(x => x.type !== 'strength'); if (!runs.length) continue;
    const ok = runs.filter(x => r.log[x.id]?.done).length / runs.length >= 0.6;
    if (ok) n++; else if (i !== ci) break;
  }
  return n;
}
function planStart(r = me()) { return r.firstStart || r.profile.startDate; }
function planOver(r = me()) { const ws = r.plan.weeks; const end = E.fmtDate(E.addDays(E.parseDate(ws[ws.length - 1].start), 6)); return r.plan.raceDate ? todayStr() > r.plan.raceDate : todayStr() > end; }

// ---------- router ----------
let tab = 'week', viewWeek = null, lastRenderDay = todayStr();
function go(t, opts = {}) { tab = t; if (opts.week != null) viewWeek = opts.week; else if (t === 'week') viewWeek = curWeekIndex(); render(); window.scrollTo({ top: 0 }); }

function render() {
  applyTheme();
  lastRenderDay = todayStr();
  const root = $('#root');
  try {
    if (!me() && !ob.active) { startOnboarding({}, {}); return; }
    if (ob.active) { unitOverride = ob.d.units; root.innerHTML = renderOnboarding(); bindOnboarding(); return; }
    unitOverride = null;
    if (viewWeek == null) viewWeek = curWeekIndex();
    const r = me();
    const body = tab === 'week' ? renderWeek(r) : tab === 'plan' ? renderPlan(r) : tab === 'paces' ? renderPaces(r) : renderMe(r);
    root.innerHTML = `<main class="wrap">${topbar(r)}${body}</main>${nav()}`;
    bindCommon();
    if (tab === 'plan') { const c = $('.weekrow.cur'); if (c && !render._scrolled) { render._scrolled = true; } }
  } catch (e) {
    console.error(e);
    root.innerHTML = `<main class="wrap"><div class="card stack"><h2>Something went wrong</h2><p class="small muted">Pacer hit an error showing this plan. You can download a backup and reset, then restore or rebuild.</p><p class="tiny muted">${esc(e.message)}</p><div class="grid2"><button class="btn" id="errbk">Download backup</button><button class="btn danger" id="errreset">Reset this runner</button></div></div></main>`;
    $('#errbk').onclick = () => ACTIONS.export();
    $('#errreset').onclick = () => { delete S.profiles[S.activeId]; S.activeId = Object.keys(S.profiles)[0] || null; save(); ob.active = false; viewWeek = null; render(); };
  }
}
function topbar(r) {
  return `<header class="topbar"><div class="logo"><span class="logo-mark">${ICON.logo}</span>Pacer</div>
  <div class="row"><button class="icon-btn" data-act="invite" aria-label="Invite your mates">${ICON.share}</button>
  <button class="avatar" data-act="runners" aria-label="Runner: ${esc(r.profile.name)}. Switch or add runners" style="background:${tc(goalType(r.profile.goal))};color:var(--t-ink);border:0">${esc((r.profile.name || '?').trim().charAt(0).toUpperCase())}</button></div></header>`;
}
const goalType = g => ({ start: 'runwalk', '5k': 'intervals', '10k': 'tempo', half: 'fartlek', marathon: 'long', fitness: 'easy' }[g] || 'easy');
function nav() {
  const b = (id, label) => `<button data-go="${id}" ${tab === id ? 'aria-current="page"' : ''}>${ICON[id]}<span>${label}</span></button>`;
  return `<nav class="tabs" aria-label="Main"><div class="in">${b('week', 'This week')}${b('plan', 'Plan')}${b('paces', 'Paces')}${b('me', 'Me')}</div></nav>`;

// ---------- WEEK VIEW ----------
const PHASE_MSG = {
  Base: 'Base phase: building your aerobic engine. Most running is easy — that’s the point. Resist the urge to push the easy days.',
  Build: 'Build phase: sessions get more specific. Nail the quality days, keep easy days truly easy, and sleep well.',
  Peak: 'Peak phase: your biggest weeks. Fuel properly, prioritise recovery, and trust the process.',
  Taper: 'Taper: volume drops so you arrive fresh. Feeling restless or sluggish is normal — keep the legs ticking over.',
  Race: 'Race week! Short, sharp and rested. Lay out your kit, plan your breakfast, and enjoy it — you’ve earned this.',
};
let ringN = 0;
function ringSvg(done, total) {
  const p = total ? Math.min(1, done / total) : 0, R = 32, C = 2 * Math.PI * R, id = 'rg' + (++ringN);
  return `<svg class="ring" viewBox="0 0 76 76" role="img" aria-label="${Math.round(p * 100)}% of this week’s distance complete">
  <defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="var(--brand)"/><stop offset="1" stop-color="var(--brand-2)"/></linearGradient></defs>
  <circle cx="38" cy="38" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="8"/>

  <text x="38" y="51" text-anchor="middle" font-size="9" fill="var(--muted)">done</text></svg>`;
}
let justDone = null;
function workoutCard(w, r) {
  const st = statusOf(w, r); const t = wTotals(w, r); const l = r.log[w.id];
  const feel = l?.feel ? { easy: 'felt easy', right: 'felt just right', hard: 'felt hard' }[l.feel] : '';
  const meta = st === 'done' ? `Done${l.km ? ' · ' + distKm(l.km) : w.type === 'strength' ? '' : ' · ' + dist(t.m)}${feel ? ' · ' + feel : ''}`
    : w.type === 'strength' ? `${TYPES[w.type].label} · ${num(w.mins)} min` : `${TYPES[w.type].label} · ${dist(t.m)} · ~${dur(t.sec)}`;
  const icon = st === 'done' ? `<span class="check ${justDone === w.id ? 'pop' : ''}">${ICON.check}</span>` : st === 'skipped' ? `<span class="pill">Skipped</span>` : st === 'missed' ? `<span class="small" style="color:var(--bad);font-weight:700">Missed</span>` : `<span class="muted">${ICON.right}</span>`;
  const label = `${niceDate(w.date, { weekday: 'long', day: 'numeric', month: 'short' })}: ${fmtTitle(w.title)}. ${meta}. ${{ done: 'Completed', skipped: 'Skipped', missed: 'Missed', today: 'Today', upcoming: '' }[st]}`;
  return `<button class="wk ${st}" style="--tc:${tc(w.type)}" data-open="${esc(w.id)}" aria-label="${esc(label)}" ${st === 'today' ? 'aria-current="date"' : ''}>
    <span class="badge" aria-hidden="true">${TYPES[w.type].ab}</span>
    <span style="min-width:0"><span class="t" style="display:block">${esc(fmtTitle(w.title))}</span><span class="m">${esc(meta)}</span></span>
    <span class="st" aria-hidden="true">${icon}</span></button>`;
}
function keyPace(w, pt) {
  const main = E.flatten(w.steps).filter(s => s.k === 'run');
  const order = ['REP', 'STR', 'I', 'FIVE', 'TEN', 'T', 'GOAL', 'HM', 'M', 'HILL', 'LR', 'E', 'RC', 'WALK'];
  main.sort((a, b) => order.indexOf(a.p) - order.indexOf(b.p));
  const s = main[0]; if (!s) return '';
  if (s.p === 'E' || s.p === 'LR') return paceRange(pt.Elo, pt.Ehi);

}
function nextUp(r, after) { return allWorkouts(r).filter(w => w.date > after && w.type !== 'strength').sort((a, b) => a.date.localeCompare(b.date))[0]; }
function todayCard(r) {

  const items = allWorkouts(r).filter(w => w.date === t && w.type !== 'strength');
  const str = allWorkouts(r).find(w => w.date === t && w.type === 'strength');
  const nx = nextUp(r, t);
  const nxTxt = nx ? `Next: ${niceDate(nx.date, { weekday: 'short' })} · ${esc(fmtTitle(nx.title))}` : '';
  if (t < planStart(r)) return `<div class="card coach"><div class="who">${ICON.bolt} Your plan starts ${niceDate(planStart(r), { weekday: 'long', day: 'numeric', month: 'long' })}</div><p class="small muted" style="margin:0">Keep ticking over with a couple of easy runs until then. ${nxTxt}</p></div>`;
  const due = items.find(w => !r.log[w.id]);
  if (due) {
    const pt = ptFor(r.plan.weeks[due.week], r); const tt = wTotals(due, r);
    return `<div class="card coach" style="--tc:${tc(due.type)}"><div class="eyebrow muted">Today</div><div class="who" style="margin-top:6px"><span class="badge" style="min-width:36px;height:36px">${TYPES[due.type].ab}</span><span>${esc(fmtTitle(due.title))}</span></div>
      <div class="small muted">${dist(tt.m)} · ~${dur(tt.sec)} · key pace <b style="color:var(--text)">${keyPace(due, pt)}</b></div>
      <button class="btn primary block" style="margin-top:12px" data-open="${esc(due.id)}">View session</button></div>`;
  }
  if (items.length) return `<div class="card celebrate"><div class="who"><span class="check">${ICON.check}</span> Today’s run is done — nice work!</div><p class="small muted" style="margin:0">${nxTxt}</p></div>`;
  const beforeLong = nx && nx.type === 'long' && daysBetween(t, nx.date) === 1;
  return `<div class="card coach"><div class="eyebrow muted">Today</div><div class="who" style="margin-top:6px">Rest day${str ? ' + strength' : ''}</div><p class="small muted" style="margin:0">${beforeLong ? 'Big run tomorrow — hydrate, eat well and get to bed early. ' : 'Recovery is when you get fitter. '}${nxTxt}</p>${str ? `<button class="btn block" style="margin-top:10px" data-open="${esc(str.id)}">View strength session</button>` : ''}</div>`;
}
function renderWeek(r) {
  const ws = r.plan.weeks; viewWeek = Math.max(0, Math.min(ws.length - 1, viewWeek));
  const wk = ws[viewWeek];
  const runs = wk.workouts.filter(w => w.type !== 'strength');
  const totalM = runs.reduce((s, w) => s + wTotals(w, r).m, 0);
  const doneM = runs.filter(w => r.log[w.id]?.done).reduce((s, w) => s + (r.log[w.id].km ? r.log[w.id].km * 1000 : wTotals(w, r).m), 0);
  const t = todayStr();
  const isCur = viewWeek === curWeekIndex(r) && t >= ws[0].start;
  const streak = streakOf(r);
  let days = '';
  for (let d = 0; d < 7; d++) {
    const date = E.fmtDate(E.addDays(E.parseDate(wk.start), d));
    const items = wk.workouts.filter(w => w.date === date);
    const before = date < planStart(r);
    const restTip = before ? 'Before your plan starts' : 'Rest day';
    days += `<div class="day ${date === t ? 'today' : ''}"><div class="dl"><div class="d">${E.DAYS[d]}</div><div class="n">${E.parseDate(date).getDate()}</div></div>
      <div>${items.length ? items.map(w => workoutCard(w, r)).join('') : `<div class="rest">${restTip}</div>`}</div></div>`;
  }
  const allDone = runs.length > 0 && runs.every(w => r.log[w.id]?.done || r.log[w.id]?.skipped) && runs.some(w => r.log[w.id]?.done);

  <section class="stack">

    ${over ? `<div class="card hero"><div class="eyebrow muted">Plan complete</div><h2 style="margin-top:6px">You did it, ${esc(r.profile.name)}! 🎉</h2><p class="small muted">${r.plan.raceDate ? 'Log your race result to update your fitness score, then build your next block.' : 'Time for the next block — your new plan starts from your current fitness.'}</p><div class="grid2"><button class="btn" data-go="paces">Log result</button><button class="btn primary" data-act="nextplan">Build next plan</button></div></div>` : ''}
    ${isCur || (viewWeek === 0 && t < ws[0].start) ? todayCard(r) : ''}
    <div class="weekhead">
      <div><div class="eyebrow muted">${isCur ? 'This week' : niceDate(wk.start, { day: 'numeric', month: 'short' }) + ' – ' + niceDate(E.fmtDate(E.addDays(E.parseDate(wk.start), 6)), { day: 'numeric', month: 'short' })}</div>
      <h1>Week ${viewWeek + 1} <span class="muted" style="font-weight:600">of ${ws.length}</span></h1>
      <div class="row" style="margin-top:6px;gap:6px;flex-wrap:wrap"><span class="pill ppill phase-${wk.phase}">${wk.phase}${wk.cut ? ' · Cutback' : ''}</span><span class="pill">${dist(doneM)} / ${dist(totalM)}</span>${streak >= 2 ? `<span class="pill brand">${ICON.fire} ${streak}-week streak</span>` : ''}</div></div>
      ${ringSvg(doneM, totalM)}
    </div>
    <div class="row between no-print">
      <button class="icon-btn" data-act="prevw" aria-label="Previous week" ${viewWeek === 0 ? 'disabled' : ''}>${ICON.left}</button>
      ${isCur ? `<span class="small muted">${runs.length} run${runs.length === 1 ? '' : 's'} this week</span>` : `<button class="btn ghost" data-act="thisw">Back to this week</button>`}
      <button class="icon-btn" data-act="nextw" aria-label="Next week" ${viewWeek === ws.length - 1 ? 'disabled' : ''}>${ICON.right}</button>
    </div>
    ${allDone ? `<div class="card celebrate"><div class="who"><span class="check pop">${ICON.check}</span> Week ${viewWeek + 1} complete!</div><p class="small muted" style="margin:0 0 10px">${dist(doneM)} · ${runs.filter(w => r.log[w.id]?.done).length}/${runs.length} runs${streak >= 2 ? ` · ${streak}-week streak 🔥` : ''}</p><button class="btn block" data-act="shareweek">${ICON.share} Share with your mates</button></div>` : ''}

// ---------- WORKOUT SHEET ----------
let sheetId = null, sheetOpener = null;
function findW(id, r = me()) { return allWorkouts(r).find(w => w.id === id); }
function zoneColor(p) { return `var(--z${E.PACE_INFO[p]?.zone ?? 2})`; }
function chartSvg(steps, pt) {
  const flat = E.flatten(steps); const tot = flat.reduce((s, x) => s + E.stepSecs(x, pt), 0) || 1;
  let x = 0; const W = 600, H = 64;
  const bars = flat.map(s => { const w = E.stepSecs(s, pt) / tot * W; const z = E.PACE_INFO[s.p]?.zone ?? 2; const h = 14 + z * 10; const out = `<rect x="${x.toFixed(1)}" y="${H - h}" width="${Math.max(1, w - 1.5).toFixed(1)}" height="${h}" rx="3" fill="${zoneColor(s.p)}" stroke="rgba(0,0,0,.12)" stroke-width="1"/>`; x += w; return out; }).join('');
  return `<svg class="svgchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Session intensity profile: taller bars are harder">${bars}</svg>`;
}
function stepLine(s, pt, seen) {
  const nice = s.m != null ? (s.m < 1000 && units() === 'km' ? s.m + 'm' : dist(s.m, s.m < 1000 ? 2 : 1)) : (s.s < 120 ? s.s + 's' : (s.s % 60 ? E.fmtTime(s.s) : (s.s / 60) + ' min'));

  if (s.p === 'WALK') paceTxt = 'Walk';
  else if (s.p === 'HILL') paceTxt = 'Hard effort';
  else if (s.p === 'E' || s.p === 'LR') paceTxt = paceRange(pt.Elo, pt.Ehi);
  else if (s.p === 'RC') paceTxt = `> ${pace(pt.Ehi)}`;

// ---------- plan editing (keeps history) ----------

  const overlap = r.plan.weeks.find(w => w.start === newMon);
  if (overlap) { const keep = overlap.workouts.filter(w => w.date < p.startDate && r.log[w.id]); np.weeks[0].workouts = [...keep, ...np.weeks[0].workouts].sort((a, b) => a.day - b.day); }

}

function icsFold(line) { // RFC 5545: fold lines at 75 octets

    count++;
    const d = w.date.replace(/-/g, ''); const end = E.fmtDate(E.addDays(E.parseDate(w.date), 1)).replace(/-/g, '');

const PREF_LIST = [['intervals', 'Intervals', 'Short, fast reps on track or road'], ['tempo', 'Tempo runs', 'Sustained “comfortably hard” efforts'], ['hills', 'Hills', 'Uphill reps for strength and power'], ['fartlek', 'Fartlek', 'Unstructured speed play'], ['progression', 'Progression runs', 'Start easy, finish fast'], ['strides', 'Strides', 'Short relaxed accelerations after easy runs']];

  $('[data-ob="back"]')?.addEventListener('click', back);
  $('[data-ob="cancel"]')?.addEventListener('click', () => { ob.active = false; clearInvite(); render(); });
  const nm = $('#nm'); if (nm) { nm.focus(); nm.addEventListener('keydown', e => { if (e.key === 'Enter' && stepValid()) advance(); }); }
}
function back() {
  clearTimeout(ob._t);
  let s = ob.step - 1; while (s > 0 && skipStep(STEPS[s])) s--;
  if (ob.step === 0 || (ob.opts.editing && s < 1)) { if (me()) { ob.active = false; clearInvite(); render(); } return; }
  ob.step = Math.max(0, s); render(); window.scrollTo({ top: 0 });
}
function advance() {
  clearTimeout(ob._t);
  if (!stepValid()) return;
  if (STEPS[ob.step] === 'summary') return finishOnboarding();
  let s = ob.step + 1; while (s < STEPS.length - 1 && skipStep(STEPS[s])) s++;
  ob.step = s; render(); window.scrollTo({ top: 0 });
  setTimeout(() => $('.ob h1')?.focus?.(), 0);
}
function clearInvite() { ob.invite = null; if (location.hash) history.replaceState(null, '', location.pathname + location.search); }
function finishOnboarding() {
  const p = profileFromOb();
  if (ob.opts.editing && me()) { rebuildPlan(me(), p); }
  else { const id = uid(); S.profiles[id] = { profile: p, plan: E.generate(p), log: {}, fb: 0, base: 0, created: todayStr() }; S.activeId = id; }
  const editing = ob.opts.editing;
  ob.active = false; clearInvite(); viewWeek = null; tab = 'week';
  save(); render(); window.scrollTo({ top: 0 });
  toast(editing ? 'Plan updated from today — your history is kept.' : `Plan built! Welcome aboard, ${p.name}.`);
}

// paces calculator live binding (delegated)
function calcUpdate(e) {
  if (e.target.id === 'rt') { e.target.setAttribute('aria-invalid', 'false'); const er = $('#rterr'); if (er) er.textContent = ''; }
  if (e.target.id !== 'ct' && e.target.id !== 'cd') return;
  calc.t = $('#ct').value; calc.d = +$('#cd').value; $('#calcout').textContent = calcText();
}
document.addEventListener('input', calcUpdate);
document.addEventListener('change', calcUpdate);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && todayStr() !== lastRenderDay && !ob.active && !$('#sheet')) { viewWeek = null; render(); } });

// ---------- boot ----------
function parseInvite() {
  const m = location.hash.match(/invite=([\w-]+)/); if (!m) return null;
  try {
    const inv = unb64(m[1]); if (!inv || typeof inv !== 'object') return null;
    return { by: String(inv.by || 'A friend').slice(0, 30), g: Object.prototype.hasOwnProperty.call(E.GOALS, inv.g) ? inv.g : null, d: typeof inv.d === 'string' && /^\d{4}-\d\d-\d\d$/.test(inv.d) && inv.d > E.fmtDate(E.addDays(new Date(), 7)) ? inv.d : null, n: typeof inv.n === 'string' ? inv.n.slice(0, 60) : '' };
  } catch (e) { return null; }
}
async function boot() {
  const inv = parseInvite();
  if (inv) {
    ob.invite = inv;
    const pre = { invitedBy: inv.by }; if (inv.g) pre.goal = inv.g; if (inv.d) pre.raceDate = inv.d; if (inv.n) pre.raceName = inv.n;
    if (me()) {
      render();
      const ok = await confirmSheet({ title: `${inv.by} invited you to train`, body: `Create a new plan${inv.g ? ' for ' + (inv.n || E.GOALS[inv.g].name) : ''}? Your existing plan stays saved on this device.`, ok: 'Create plan' });
      if (ok) startOnboarding({ ...pre, units: units() }, { newRunner: true }); else { clearInvite(); render(); }
      return;
    }
    startOnboarding(pre, {}); return;
  }
  render();
}
boot();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
